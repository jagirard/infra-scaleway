name: Bootstrap Onizuka Object Storage credentials

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    environment: scaleway-dev
    steps:
      - name: Install Scaleway CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/scaleway/scaleway-cli/master/scripts/get.sh | sh
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Configure Kapsule credentials
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_DEFAULT_PROJECT_ID: ${{ vars.SCW_PROJECT_ID }}
          SCW_DEFAULT_REGION: fr-par
          SCW_DEFAULT_ZONE: fr-par-1
        run: |
          set -euo pipefail
          cluster_id="$(scw k8s cluster list region=fr-par -o json | jq -r '.[] | select(.name == "kapsule-scw-dev-01") | .id')"
          test -n "$cluster_id"
          scw k8s kubeconfig get "$cluster_id" region=fr-par with-admin=true > "$RUNNER_TEMP/kubeconfig"
          chmod 600 "$RUNNER_TEMP/kubeconfig"
          kubectl --kubeconfig "$RUNNER_TEMP/kubeconfig" -n onizuka create secret generic onizuka-scaleway-object-storage \
            --from-literal=SCW_ACCESS_KEY="$SCW_ACCESS_KEY" \
            --from-literal=SCW_SECRET_KEY="$SCW_SECRET_KEY" \
            --from-literal=SCW_DEFAULT_PROJECT_ID="$SCW_DEFAULT_PROJECT_ID" \
            --dry-run=client -o yaml |
            kubectl --kubeconfig "$RUNNER_TEMP/kubeconfig" apply -f -
