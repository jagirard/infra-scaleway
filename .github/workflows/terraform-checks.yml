name: Terraform checks

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    name: Format and validate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "1.14.9"
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize bootstrap without backend
        run: terraform -chdir=kapsule/bootstrap init -backend=false -input=false

      - name: Validate bootstrap
        run: terraform -chdir=kapsule/bootstrap validate

      - name: Initialize main stack without backend
        run: terraform -chdir=kapsule/00-kapsule init -backend=false -input=false

      - name: Validate main stack
        run: terraform -chdir=kapsule/00-kapsule validate
